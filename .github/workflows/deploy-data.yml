name: Deploy Notara Data Layer
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a ECR
        run: |
          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin \
            495450559805.dkr.ecr.us-east-1.amazonaws.com

      - name: Build y Push a ECR
        run: |
          docker build -t 495450559805.dkr.ecr.us-east-1.amazonaws.com/notara-data:latest .
          docker push 495450559805.dkr.ecr.us-east-1.amazonaws.com/notara-data:latest

      - name: Deploy en EC2 Data via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_DATA_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --region us-east-1 \
            --parameters commands='[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 495450559805.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 495450559805.dkr.ecr.us-east-1.amazonaws.com/notara-data:latest",
              "docker stop notara-data || true",
              "docker rm notara-data || true",
              "docker run -d --name notara-data -p 5432:5432 495450559805.dkr.ecr.us-east-1.amazonaws.com/notara-data:latest"
            ]'