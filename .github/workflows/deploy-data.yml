name: Deploy Notara Data Layer

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Actualizar repositorio
        run: |
          cd /home/ec2-user/notara-data
          git pull

      - name: Levantar contenedores
        run: |
          cd /home/ec2-user/notara-data
          docker compose down || true
          docker compose up -d

      - name: Verificar contenedores
        run: docker ps
