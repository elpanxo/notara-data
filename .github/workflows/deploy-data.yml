name: Deploy Notara Data Layer

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy en EC2 vía SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_DATA_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --region us-east-1 \
            --parameters '{
              "commands":[
                "sudo systemctl start docker",
                "if [ ! -d /home/ec2-user/notara-data ]; then git clone https://github.com/elpanxo/notara-data.git /home/ec2-user/notara-data; else cd /home/ec2-user/notara-data && git pull; fi",
                "cd /home/ec2-user/notara-data",
                "sudo docker compose down || true",
                "sudo docker compose up -d"
              ]
            }'

      - name: Esperar ejecución SSM
        run: sleep 20

      - name: Verificar resultado del comando
        run: |
          aws ssm list-command-invocations \
            --instance-id "${{ secrets.EC2_DATA_INSTANCE_ID }}" \
            --details \
            --region us-east-1 \
            --query "CommandInvocations[*].CommandPlugins[*].{Status:Status,Output:Output}" \
            --output table
