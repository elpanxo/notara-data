name: Deploy Notara Data Layer
on:
  push:
    branches: [deploy]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy en EC2 Data via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_DATA_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --region us-east-1 \
            --parameters commands='[
              "if [ ! -d /home/ec2-user/notara-data ]; then git clone https://github.com/elpanxo/notara-data.git /home/ec2-user/notara-data; else cd /home/ec2-user/notara-data && git pull; fi",
              "cd /home/ec2-user/notara-data",
              "docker compose down || true",
              "docker compose up -d"
            ]'

      - name: Verificar estado del comando
        run: |
          sleep 15
          aws ssm list-command-invocations \
            --instance-id "${{ secrets.EC2_DATA_INSTANCE_ID }}" \
            --details \
            --region us-east-1 \
            --query "CommandInvocations[0].CommandPlugins[0].{Status:Status,Output:Output}" \
            --output table
