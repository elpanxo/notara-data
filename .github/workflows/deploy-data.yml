name: Deploy Data Layer

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy en EC2-Data via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_DATA_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "if [ ! -d /home/ec2-user/repo ]; then git clone https://github.com/elpanxo/notara-data.git /home/ec2-user/repo; else cd /home/ec2-user/repo && git pull; fi",
              "cd /home/ec2-user/repo",
              "echo POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} > .env",
              "docker compose -f docker-compose.yml up -d --pull always"
            ]'
